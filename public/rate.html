<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate This Idea — MAYA Calibration</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      var p = window.location.pathname;
      if (p.endsWith('/')) window.BASE = p;
      else if (p.endsWith('.html')) window.BASE = p.substring(0, p.lastIndexOf('/') + 1);
      else window.BASE = p + '/';
      if (!p.endsWith('/') && !p.endsWith('.html')) {
        var link = document.createElement('link');
        link.rel = 'stylesheet'; link.href = p + '/style.css';
        document.head.appendChild(link);
      }
    })();
  </script>
</head>
<body>

  <header class="header">
    <div class="container">
      <h1>MAYA <span>Calibration</span></h1>
      <span class="header-badge" id="sessionBadge">Loading…</span>
    </div>
  </header>

  <main>
    <div class="container">

      <!-- Rating Form -->
      <div id="formView">
        <div class="session-info" id="sessionInfo">
          <div class="session-info-item">Presenter: <strong id="presenterName">—</strong></div>
          <div class="session-info-item">Product: <strong id="productType">—</strong></div>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <p class="text-muted mb-16" style="font-size:0.8rem">
          <span id="answeredCount">0</span> of 10 answered
        </p>

        <form id="ratingForm" novalidate></form>

        <button type="button" class="btn btn-primary" id="submitBtn" disabled style="width:100%; margin-top:8px;">
          Submit Rating
        </button>
      </div>

      <!-- Confirmation -->
      <div id="confirmView" class="hidden">
        <div class="card confirmation">
          <div class="confirmation-icon" aria-hidden="true">&#10003;</div>
          <h2>Thank you!</h2>
          <p>Your anonymous rating has been submitted.<br>The presenter will see the combined results.</p>
        </div>
      </div>

      <!-- Error -->
      <div id="errorView" class="hidden">
        <div class="card text-center" style="padding:48px 20px">
          <h2 class="mb-8">Session Not Found</h2>
          <p class="text-muted">This link may have expired or the session has ended.<br>Please ask your instructor for a new QR code.</p>
        </div>
      </div>

    </div>
  </main>

  <script>
  (function() {
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session');

    const ITEMS = [
      { id: 'N1', type: 'novelty',     text: 'I have not seen an idea like this before.' },
      { id: 'N2', type: 'novelty',     text: 'This idea surprised me.' },
      { id: 'N3', type: 'novelty',     text: 'This idea is different from the other ideas in class.' },
      { id: 'N4', type: 'novelty',     text: 'This idea goes beyond what I would expect for this type of product.' },
      { id: 'N5', type: 'novelty',     text: 'This idea is thought-provoking and opens new directions.' },
      { id: 'F1', type: 'familiarity', text: 'I immediately understand what this is and how it would be used.' },
      { id: 'F2', type: 'familiarity', text: 'This looks like a typical PRODUCT.' },
      { id: 'F3', type: 'familiarity', text: 'I feel like I have seen something similar before.' },
      { id: 'F4', type: 'familiarity', text: 'The design resembles its inspiration source too literally.' },
      { id: 'F5', type: 'familiarity', text: 'This design makes sense for its intended purpose.' },
    ];

    async function init() {
      if (!sessionId) return showError();

      try {
        const res = await fetch(window.BASE + `api/get-session?id=${sessionId}`);
        if (!res.ok) return showError();
        const session = await res.json();

        document.getElementById('sessionBadge').textContent = 'Session Active';
        document.getElementById('presenterName').textContent = session.presenter;
        document.getElementById('productType').textContent = session.productType;

        buildForm(session.productLabel || 'product');
      } catch {
        showError();
      }
    }

    function buildForm(productLabel) {
      const form = document.getElementById('ratingForm');
      form.innerHTML = ITEMS.map(item => {
        const label = item.id === 'F2' ? item.text.replace('PRODUCT', productLabel) : item.text;
        const tag = item.type === 'novelty' ? 'tag-novelty' : 'tag-familiarity';
        const tagLabel = item.type === 'novelty' ? 'Novelty' : 'Familiarity';

        return `
          <div class="rating-item" data-item="${item.id}">
            <div class="rating-label">
              <span class="tag ${tag}">${tagLabel}</span>
              ${label}
            </div>
            <div class="scale-row">
              ${[1,2,3,4,5].map(v => `
                <div class="scale-option">
                  <input type="radio" name="${item.id}" id="${item.id}_${v}" value="${v}">
                  <label for="${item.id}_${v}">${v}</label>
                </div>
              `).join('')}
            </div>
            <div class="scale-labels">
              <span>Strongly Disagree</span>
              <span>Strongly Agree</span>
            </div>
          </div>`;
      }).join('');

      // Listen for changes
      form.addEventListener('change', updateProgress);
    }

    function updateProgress() {
      let answered = 0;
      ITEMS.forEach(item => {
        const checked = document.querySelector(`input[name="${item.id}"]:checked`);
        const el = document.querySelector(`[data-item="${item.id}"]`);
        if (checked) { answered++; el.classList.add('answered'); }
        else { el.classList.remove('answered'); }
      });
      document.getElementById('answeredCount').textContent = answered;
      document.getElementById('progressFill').style.width = `${(answered / 10) * 100}%`;
      document.getElementById('submitBtn').disabled = answered < 10;
    }

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Submitting…';

      const data = { sessionId };
      ITEMS.forEach(item => {
        const val = document.querySelector(`input[name="${item.id}"]:checked`);
        data[item.id] = val ? parseInt(val.value) : null;
      });

      try {
        const res = await fetch(window.BASE + 'api/rate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (res.ok) {
          document.getElementById('formView').classList.add('hidden');
          document.getElementById('confirmView').classList.remove('hidden');
        } else {
          btn.disabled = false;
          btn.textContent = 'Submit Rating';
          alert('Something went wrong. Please try again.');
        }
      } catch {
        btn.disabled = false;
        btn.textContent = 'Submit Rating';
        alert('Cannot connect. Please check your connection.');
      }
    });

    function showError() {
      document.getElementById('formView').classList.add('hidden');
      document.getElementById('errorView').classList.remove('hidden');
    }

    init();
  })();
  </script>
</body>
</html>
